</style></head><body><header><small>ARCHITECT EXAM / SITE PLANNING</small><h1>敷地計畫・近十年申論題庫</h1><p>106–114 年｜同年度合併題組｜原題與考選部出處｜精簡答題與個人筆記</p></header><div class="layout"><aside class="side"><div class="panel sticky"><div class="stats"><div class="stat"><b>10</b><small>考試年度</small></div><div class="stat"><b>14</b><small>申論子題</small></div></div><label for="search">搜尋題目／關鍵字</label><input id="search" type="search" placeholder="例如：韌性、雨水、交通、都更"><label for="year">篩選年度</label><select id="year"><option value="all">全部年度</option></select><label for="topic">篩選主題</label><select id="topic"><option value="all">全部主題</option></select><div class="filterActions"><button id="reset">清除篩選</button></div><div id="items" class="items"></div><div class="hint">依年度合併題組；每個子題均可個別顯示原題、答案與編輯筆記。筆記自動儲存在本機瀏覽器，建議定期匯出備份。</div><div class="filterActions"><button id="exportNotes">匯出筆記</button><button id="importNotes">匯入筆記</button><input type="file" id="notesFile" accept="application/json,.json" style="display:none"></div><div class="hint">105 年以都市設計準則及基地配置題組為主，未列入獨立申論題數；可由底部原始試卷來源查閱。</div></div></aside><main class="main"><div class="panel" id="detail"></div></main></div><script>
const DATA=[{"id": "114-1", "year": 114, "title": "韌性城市與立體化敷地", "topic": "韌性防災", "question": "試述面對極端氣候，韌性城市目標下的敷地計畫，在防洪、綠化、水資源、替代能源、避難通道及空間彈性方面，有哪些立體化作為？", "intro": "敷地計畫應由地面平面配置轉向地下、地面、空中與屋頂的立體整合，提升抗災、調適與復原能力。", "sections": [{"title": "防洪", "items": ["地下設滯洪池，地面設下凹綠地及透水鋪面。", "屋頂綠化與雨水暫存，削減洪峰逕流。"]}, {"title": "綠化", "items": ["串聯地面綠帶、生態廊道與空中花園。", "設置垂直綠牆、屋頂花園，改善熱島與微氣候。"]}, {"title": "水資源", "items": ["屋頂集水、地下貯留，供澆灌、沖廁等非飲用用途。"]}, {"title": "替代能源", "items": ["設置屋頂光電、建築整合光電及儲能微電網，備援供電。"]}, {"title": "避難通道", "items": ["串聯地面疏散路徑、高架連通步道、垂直避難與安全平台。"]}, {"title": "空間彈性", "items": ["公園、廣場平時休憩，災時轉為集結、物資與安置空間。"]}], "conclusion": "以「立體整合、藍綠共構、資源循環、平災轉換」建立韌性都市。", "keywords": "地下滯洪／空中綠網／雨水回收／微電網／立體避難／平災轉換", "notes": "Kevin Lynch：路徑、邊界、區域、節點、地標可轉化成立體避難與公共服務網絡。"}, {"id": "113-1", "year": 113, "title": "水文調查與都市減洪", "topic": "水文防洪", "question": "敷地計畫應做哪些基地水文調查？當都市排水系統無法即時擴充時，都市設計及敷地計畫分別有哪些減緩水患的方案？", "intro": "極端降雨使排水系統面臨超量負荷，應由快速排水轉向源頭減量、分散滯洪、逕流分擔。", "sections": [{"title": "基地水文調查", "items": ["降雨強度、頻率、延時及歷史極端雨量。", "地形高程、坡度、集水區及地表逕流路徑。", "河川水系、淹水紀錄與排水出口水位。", "地下水位、土壤滲透係數與土地不透水率。", "既有雨水下水道容量、排水瓶頸與下游承受能力。"]}, {"title": "都市設計層面", "items": ["以土地使用管制保留滯洪與蓄水空間。", "串聯河川、公園、濕地及綠帶形成藍綠網絡。", "規劃防洪公園、下凹廣場、道路植生滯留與逕流分擔。"]}, {"title": "敷地計畫層面", "items": ["設置透水鋪面、雨水花園、綠屋頂與地下滯洪池。", "透過雨水回收、出流管制與基地保水降低尖峰排放。", "抬高重要出入口與機電設備，設防水閘門防止倒灌。"]}], "conclusion": "透過流域整合、都市滯洪與基地保水，提升都市防洪韌性。", "keywords": "雨量／地形／水系／地下水／排水容量；藍綠網絡／LID／出流管制", "notes": "區分「都市設計＝區域公共系統」與「敷地計畫＝單一基地設施」。出流管制與逕流分擔並非同義。"}, {"id": "112-1", "year": 112, "title": "無形環境與場所脈絡調查", "topic": "基地調查", "question": "面對具有歷史、社會、文化與記憶特色的基地，應調查哪些項目？採用哪些分析方法？由哪些管道取得資訊？", "intro": "基地分析除量化自然環境資料外，尚應納入地方記憶與社會文化等非量化涵構，才能形成具場所精神的設計。", "sections": [{"title": "調查項目", "items": ["歷史沿革、古蹟遺址、舊街廓與文化地景。", "地方產業、生活習俗、宗教節慶及集體記憶。", "社群網絡、居民活動、空間認同及地方故事。"]}, {"title": "分析方法", "items": ["歷史地圖疊圖，辨識都市紋理與空間變遷。", "實地踏查、行為觀察、認知地圖與活動時段分析。", "訪談居民、利害關係人，歸納場所價值。"]}, {"title": "資料來源", "items": ["地方志、文獻、老照片及歷史航照。", "文化資產資料庫、都市計畫書圖、地籍與政府檔案。", "地方文史工作者、耆老訪談及社區參與。"]}], "conclusion": "以質性、量化資料交互驗證，將地方記憶轉化為公共空間與建築設計策略。", "keywords": "歷史／文化／記憶；疊圖／訪談／行為觀察；文獻／居民／政府圖資", "notes": "對應「調查項目—分析方法—資訊來源」三欄作答。勿只寫氣候、坡度等一般基地條件。"}, {"id": "111-1", "year": 111, "title": "韌性城市概念與都市設計", "topic": "韌性防災", "question": "說明對「韌性城市」的認知，以及都市設計層面的關鍵思考要素。", "intro": "韌性城市指都市面對災害或衝擊時具備抵抗、吸收、適應與快速恢復基本功能的能力。", "sections": [{"title": "防災調適", "items": ["依災害潛勢調整土地利用，保留河川行水與滯洪空間。", "建構藍綠網絡、透水開放空間與氣候調適設施。"]}, {"title": "系統備援", "items": ["避難道路、緊急交通及公共設施具有替代路徑。", "水、電、通訊及醫療服務採分散與備援設計。"]}, {"title": "社會韌性", "items": ["社區避難據點結合日常公共生活。", "強化高齡、兒童及行動不便者之可近性與互助機制。"]}, {"title": "彈性復原", "items": ["公共空間平災多目標使用，重要設施易於修復與重啟。"]}], "conclusion": "都市設計應整合環境、設施與社會網絡，使城市從單一抗災轉向全面調適。", "keywords": "抵抗／吸收／適應／復原；藍綠網絡／備援／平災轉換", "notes": "注意韌性不只是防洪，還包括熱浪、能源、交通、社區治理及弱勢可及性。"}, {"id": "111-2", "year": 111, "title": "雙向六線道韌性街道設計", "topic": "交通街道", "question": "依臺灣本土氣候，設計新開發都市環境的雙向六線道主要道路，導入城市韌性與友善使用者的概念，並以圖文說明。", "intro": "主要道路除交通運輸外，亦承擔綠帶、防洪、步行及緊急救援等公共服務，應落實完整街道。", "sections": [{"title": "斷面配置", "items": ["雙向六車道兼顧公車停靠、路口轉向與救災通行。", "配置連續人行道、無障礙通路及安全自行車空間。"]}, {"title": "氣候調適", "items": ["道路兩側植栽遮蔭、透水鋪面與雨水花園。", "植生滯留帶及道路側溝共同分擔暴雨逕流。"]}, {"title": "交通安全", "items": ["人車分流、庇護島、縮短穿越距離、減速設計。", "無障礙路口與清晰導引提升各年齡使用安全。"]}, {"title": "防災備援", "items": ["保留緊急車輛動線與地下管線維修空間。", "避免樹根、管線、排水與無障礙設施互相衝突。"]}], "conclusion": "以人本、綠色、可達與防災兼具之完整街道，提升都市公共空間品質。", "keywords": "完整街道／遮蔭／雨水花園／庇護島／無障礙／救災通行", "notes": "考場搭配道路橫斷面；車道及人行空間寬度應依題示條件與適用規範配置，勿硬背單一固定斷面。"}, {"id": "110-1", "year": 110, "title": "基地分析作業及資料來源", "topic": "基地調查", "question": "列舉敷地計畫程序中的基地分析作業項目及各項資料取得方式或來源，並舉例如何由分析轉化為設計。", "intro": "敷地計畫應先調查自然、人文、交通、法規與設施條件，再將基地限制及潛力轉化為設計策略。", "sections": [{"title": "自然環境", "items": ["地形坡度、地質土壤：地形測量、地質鑽探。", "日照風向、降雨水文：氣象資料、現地觀測。", "植栽生態、景觀：樹籍調查、生態踏查。"]}, {"title": "人為環境", "items": ["都市計畫與建築法規：計畫書圖、主管機關資料。", "交通運輸與人流：交通調查、現地計數。", "歷史文化及鄰里活動：文獻、訪談、行為觀察。"]}, {"title": "基礎設施與風險", "items": ["排水、供水、供電、管線與公共設施：機關圖資、現勘。", "淹水、坡災、噪音：災害潛勢圖及現地量測。"]}, {"title": "設計轉化", "items": ["例如西曬面設遮陽、迎風面留通風廊道。", "例如保留老樹為公共節點，低窪地設滯洪綠地。"]}], "conclusion": "以「調查→分析→綜合判讀→設計回應」建立可追溯的基地配置邏輯。", "keywords": "地形／氣候／水文／交通／法規／管線；調查→設計", "notes": "題目要求個人經驗，考試可補一個實際操作過的基地案例，勿虛構自稱經驗。"}, {"id": "109-1", "year": 109, "title": "都市更新條例及空間影響", "topic": "都市更新", "question": "說明都市更新條例的立法意旨、重要內容，以及敷地計畫與都市設計應注意的重點和環境影響。", "intro": "都市更新著重老舊街區再生、土地合理利用、公共安全與居住環境改善，應以街廓整體觀點檢討。", "sections": [{"title": "立法目的與制度", "items": ["改善建築及公共安全、提升公共設施與環境品質。", "依都市更新相關制度辦理劃定、事業計畫、權利安排及實施。"]}, {"title": "都市設計重點", "items": ["整合街廓土地利用、交通、步行與開放空間。", "評估日照、風廊、天際線、停車、消防救災及鄰里衝擊。"]}, {"title": "環境與社會影響", "items": ["改善基盤及街區機能，但應防止量體過度集中。", "重視居民參與、安置、公平分配與地方文化保存。"]}], "conclusion": "都市更新不僅是建築改建，亦需兼顧公共利益、都市紋理及社會公平。", "keywords": "街廓整合／公共利益／權利安排／交通開放空間／居民參與", "notes": "考題所提修法日期屬出題當年背景；實務法條應另核對現行版本。"}, {"id": "109-2", "year": 109, "title": "危老重建條例及空間影響", "topic": "都市更新", "question": "說明危老重建條例立法意旨、主要內容，以及敷地計畫與都市設計上須注意的重點和環境影響。", "intro": "危老重建以加速危險與老舊建築改善為核心，重視建築安全與重建效率。", "sections": [{"title": "制度目的", "items": ["針對符合資格之危險及老舊建築推動重建，改善耐震與居住安全。", "透過重建計畫及相關獎勵誘因提高更新可行性。"]}, {"title": "基地規劃", "items": ["檢討臨路、消防救災、無障礙出入及施工影響。", "配置採光通風、停車與綠化，提高基地環境品質。"]}, {"title": "街區影響", "items": ["個別基地重建需兼顧鄰棟日照、街道界面及都市景觀。", "避免各基地零碎更新造成公共設施與街區整合不足。"]}], "conclusion": "危老重建應在加速建築安全提升的同時，兼顧基地與鄰里整體品質。", "keywords": "危險老舊／耐震安全／重建計畫／個別基地／鄰里衝擊", "notes": "危老適用條件、獎勵、程序與期限可能修正，勿將舊考題敘述視為現行法。"}, {"id": "109-3", "year": 109, "title": "都市更新與危老重建比較", "topic": "都市更新", "question": "比較都市更新條例與都市危險及老舊建築物加速重建條例的相同點與差異。", "intro": "兩制度均以改善老舊建築及居住安全為方向，但治理尺度、適用條件與推動方式不同。", "sections": [{"title": "共同點", "items": ["改善建築安全、促進老舊建物重建，可能設有獎勵措施。", "均需遵守建築、消防、都市計畫等適用規範。"]}, {"title": "都市更新特性", "items": ["可由街廓及都市再生角度整合土地、公共設施、權利與環境改善。", "制度涉及更新單元、都市更新事業及相關權利處理程序。"]}, {"title": "危老重建特性", "items": ["主要針對符合規定之危險或老舊建築，促進較快速重建。", "一般以個別基地重建為主，對整體街廓改善能力相對有限。"]}], "conclusion": "應依基地規模、產權整合、公共利益及法定條件選擇適當制度。", "keywords": "都更＝整體街廓；危老＝個別基地；共同＝安全重建", "notes": "比較時補充不同意比例、權利變換與容積獎勵條件，須以當時適用法令為準。"}, {"id": "108-1", "year": 108, "title": "鐵路高架化與車站公共空間", "topic": "交通街道", "question": "依 Kevin Lynch 敷地計畫的動態空間觀與都市公共性，分析鐵路高架化後前後站的新可能與限制，提出站前廣場新空間構想。", "intro": "鐵路高架化可解除地面交通阻隔，亦可能產生橋下陰暗、噪音與人流重組等課題，應以公共性重塑站區。", "sections": [{"title": "機會與限制", "items": ["拆除平交道阻隔，縫合前後站街區與慢行網絡。", "橋下空間可成綠廊、活動場所，但須處理噪音、採光與安全。"]}, {"title": "交通轉乘", "items": ["整合鐵路、公車、步行、自行車與接送系統。", "站前廣場人車分流，保留清晰步行主軸及無障礙轉乘。"]}, {"title": "公共空間", "items": ["以廣場、線性公園、商業活動與社區服務激活橋下空間。", "導入遮蔭、透水、雨水管理及夜間照明。"]}, {"title": "分期與治理", "items": ["評估施工轉換期動線、周邊產業與舊站歷史記憶。", "建立跨機關整合與分期使用機制。"]}], "conclusion": "從車站單體設計轉為都市縫合與公共空間重構，實現「設計都市而非僅設計建築」。", "keywords": "前後站縫合／TOD／人車分流／橋下活化／公共性", "notes": "建議畫「高架前／高架後」兩張對比分析圖，加一張站前人流與開放空間構想圖。"}, {"id": "107-1", "year": 107, "title": "都市廣場類型與形成變遷", "topic": "公共空間", "question": "說明都市或城鄉廣場定義及種類，並以臺灣一處廣場為例，說明形成、變遷、周邊互動、活動與空間型態。", "intro": "廣場為開放、可停留與交流的公共空間，是都市活動與集體記憶的重要節點。", "sections": [{"title": "定義與類型", "items": ["按功能分：市民、交通、商業、文化、宗教及紀念廣場。", "按型態分：街角、街廓內、建築前埕及交通節點廣場。"]}, {"title": "形成與變遷", "items": ["從土地使用、道路開闢、歷史事件及建築發展說明形成原因。", "比較不同时期活動與空間功能的轉變。"]}, {"title": "場域關係", "items": ["分析周邊建築界面、出入口、人流、視線及活動時段。", "辨識廣場的核心、邊界、開口、遮蔭與停留設施。"]}], "conclusion": "廣場品質應由公共性、可達性、使用彈性與地方認同綜合判斷。", "keywords": "類型／歷史變遷／周邊界面／活動時間／視線", "notes": "題目指定自行舉例：宜選自己熟悉且可畫出平面關係的臺灣廣場。"}, {"id": "107-2", "year": 107, "title": "廣場配置剖面與成功條件", "topic": "公共空間", "question": "就前題選定廣場繪製配置與剖面示意，表達空間構成、型態與尺度，並說明成功因素及未來期待。", "intro": "公共廣場設計應回應人的活動與感知尺度，透過平剖面綜合呈現場所品質。", "sections": [{"title": "平面配置", "items": ["標出建築界面、主要出入口、步行動線及活動分區。", "配置植栽遮蔭、座椅、無障礙通道與活動留白。"]}, {"title": "剖面尺度", "items": ["表達建築與廣場高寬比例、遮蔭、視線及高差處理。", "說明人尺度、停留感與邊界的開放程度。"]}, {"title": "成功條件", "items": ["可達、安全、舒適、具辨識性且可支援多樣活動。", "兼顧維護管理、夜間使用及不同族群可及性。"]}, {"title": "改善方向", "items": ["增加遮蔭、透水、彈性活動及行人優先空間。"]}], "conclusion": "以平剖面呼應日常活動、場所精神與公共空間可持續經營。", "keywords": "配置／剖面／尺度／遮蔭／公共性／管理", "notes": "此題為圖文申論，實際作答須畫平面及剖面，單用文字不足。"}, {"id": "106-1", "year": 106, "title": "都市微氣候與改善對策", "topic": "微氣候", "question": "說明都市微氣候形成原因、忽略資料分析的環境負面影響，以及都市設計改善對策。", "intro": "都市量體、鋪面、交通排熱及自然條件交互作用，形成日照、風、溫濕度的局部微氣候。", "sections": [{"title": "形成原因", "items": ["建築密度與街谷比例、風向阻擋及通風不良。", "硬鋪面蓄熱、植栽不足、交通及空調廢熱。"]}, {"title": "負面影響", "items": ["熱島與人體熱不適、能源消耗增加。", "污染累積、日照遮蔽、強風亂流及戶外活動品質降低。"]}, {"title": "都市設計對策", "items": ["保留通風廊道，控制量體排列與建築退縮。", "增加喬木遮蔭、立體綠化與高反射或透水鋪面。", "適度設計街道高寬比、開放空間、水綠設施與遮陽。"]}], "conclusion": "應以現地量測與模擬回饋都市配置，達到舒適、節能及氣候調適。", "keywords": "街谷／熱島／風廊／遮蔭／透水／排熱", "notes": "可畫街道剖面比較日照遮蔭、通風廊道與綠化效果。"}, {"id": "106-2", "year": 106, "title": "歷史文化都市空間保存", "topic": "文化保存", "question": "說明如何透過都市設計保存具歷史文化價值的空間形式及舊有都市記憶。", "intro": "歷史都市之保存應兼顧物質環境、生活文化與場所記憶，避免只留單棟建築而失去整體脈絡。", "sections": [{"title": "文化資源盤點", "items": ["調查古蹟、歷史建築、街廓紋理、道路尺度與文化地景。", "保存傳統產業、廟埕活動與集體記憶。"]}, {"title": "空間保存策略", "items": ["訂定都市設計準則，控制量體、高度、立面與視覺廊道。", "維持舊街巷尺度、歷史軸線及重要地標節點。"]}, {"title": "活化與參與", "items": ["採適應性再利用，導入文化展演、社區服務與地方產業。", "結合居民參與、維護管理與分期更新。"]}], "conclusion": "透過「保存＋活化＋參與」保留城市識別與歷史連續性。", "keywords": "歷史紋理／視覺廊道／場所記憶／適應性再利用／居民參與", "notes": "文化資產法定保存與一般都市設計引導的制度不同，答題可分層說明。"}];

const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let selectedYear=114;const showAnswers={};const showOriginals={};const showSources={};const NOTE_KEY='site-planning-notes-v1';let noteStore={};
try{const x=JSON.parse(localStorage.getItem(NOTE_KEY)||'{}');if(x&&typeof x==='object'&&!Array.isArray(x))noteStore=x}catch(e){}
for(let y=114;y>=105;y--) $('year').insertAdjacentHTML('beforeend',`<option value="${y}">${y} 年</option>`);
[...new Set(DATA.map(a=>a.topic))].sort().forEach(x=>$('topic').insertAdjacentHTML('beforeend',`<option>${esc(x)}</option>`));
function filtered(){let q=$('search').value.trim().toLowerCase();return DATA.filter(x=>($('year').value==='all'||String(x.year)===$('year').value)&&($('topic').value==='all'||x.topic===$('topic').value)&&(!q||[x.year,x.title,x.topic,x.question,x.keywords,x.notes,originalText(x)].join(' ').toLowerCase().includes(q)))}
function renderList(){const matched=filtered(),years=[...new Set(matched.map(x=>x.year))].sort((a,b)=>b-a);$('items').innerHTML=years.length?years.map(y=>{const group=DATA.filter(x=>x.year===y),hits=matched.filter(x=>x.year===y);return `<button class="item ${selectedYear===y?'active':''}" data-year="${y}"><small>${y} 年　·　${group.length} 個申論子題</small><b>${esc(group.map(x=>x.title).join('／'))}</b><span class="year-list">${hits.length!==group.length?`符合篩選 ${hits.length} 題 · `:''}點選閱讀全年度題組</span></button>`}).join(''):'<div class="empty">無符合題目。105 年主要為設計題組，未收錄獨立申論題。</div>';if(years.length&&!years.includes(selectedYear))selectedYear=years[0];document.querySelectorAll('[data-year]').forEach(b=>b.onclick=()=>{selectedYear=Number(b.dataset.year);render()});renderDetail()}
const EXAM_ORIGINAL_BY_ID={
 "112-1": "進行基地分析時，首先都會針對該基地的相關因素進行分析，例如對於氣候、地質與土壤、水文、植物、動物、土地使用、交通、噪音、景觀調查、環境污染、土地適宜性等項目的調查與分析。這些項目均為了解基地現況與特性的重要且基本的項目，而且相關的調查分析結果，均可以量化的數據來呈現，獲得科學且客觀的資訊。\n\n相對地，由於一塊基地尚有許多非屬視覺的或非屬可被量化的因素，特別是位處於擁有長久歷史之都市內的基地，或曾經發生過重要事件的基地等。這些基地都擁有許多社會、歷史、文化、記憶或其他相關因素的特色，可作為進行都市設計或建築設計時的重要依據，也因此進行基地分析時如何了解並發掘出這些特色，應是非常重要的工作。\n\n請詳述面對這類型的基地時，基地調查與分析的項目、分析的方法及可從那些管道獲得相關資訊等課題。",
 "111-1": "人類居住環境的惡化與其改善對策的思考，一直為全球持續性關注的焦點議題。近年來，我們也見證了不少由於氣候變遷與環境大幅變動，所誘發或加劇影響的災害事件，驗證了極端氣候對於人類居住環境所造成之衝擊，無論頻率或強度，正日趨加重。\n\n（一）請陳述你對於「韌性城市」此概念之認知，並提出於都市設計層面上，其關鍵的思考要素。",
 "111-2": "人類居住環境的惡化與其改善對策的思考，一直為全球持續性關注的焦點議題。近年來，我們也見證了不少由於氣候變遷與環境大幅變動，所誘發或加劇影響的災害事件，驗證了極端氣候對於人類居住環境所造成之衝擊，無論頻率或強度，正日趨加重。\n\n（二）在作為都市最重要公共開放空間的街道，是承擔城市人員貨物流通的主要動脈，請針對本土氣候條件，位於新開發都市環境中，設計一條雙向六線道的主要道路，除須具備城市通道良好設計品質外，必須導入提昇城市韌性、友善使用者等構想，並請以圖文方式說明其概念。",
 "110-1": "不論在高密度居住的都市中，或者在遼闊的山野間，建築師都必須汲取環境所給予的條件，轉換成為建築物設計的養分。\n\n所以，當建築師面對一塊陌生的基地時，如何理解基地的各種面向，以作為進入建築設計前的準備，是非常重要的程序。請列舉出敷地計畫程序中的分析作業項目，並以你的過去工作經驗，儘可能地描述各項作業的資料取得方式或來源。\n\n除此之外，你可以用你曾經經手過的工作為例，使用各種圖文來說明，上述的分析項目，如何成功地引導出獨特且令人振奮的設計方向。",
 "109-1": "（一）民國87年11月11日公布「都市更新條例」，並於108年1月30日做最新修正，請說明該條例立法意旨、重要內容及在敷地計畫與都市設計上應注意之重點和對環境的影響。",
 "109-2": "（二）民國106年5月10日公布「都市危險及老舊建築物加速重建條例」，並於109年5月6日做最新修正，請說明該條例立法意旨、重要內容及在敷地計畫與都市設計上應注意之重點和對環境的影響。",
 "109-3": "（三）請說明上述二法令之間的相同性與差異性。\n\n【前題所述法令背景，補充供理解】\n（一）民國87年11月11日公布「都市更新條例」，並於108年1月30日做最新修正。\n（二）民國106年5月10日公布「都市危險及老舊建築物加速重建條例」，並於109年5月6日做最新修正。",
 "108-1": "傳統「敷地計畫」指向技術性處理與安排營造行為，以與基地所在的自然或人為環境建立適切關係。但凱文‧林區（Kevin Lynch）在其《敷地計畫第三版》（Site Planning, 3rd edition）一書，從許多敷地計畫的典型案例檢討分析中提出敷地計畫的工作還必須要針對引入新行為模式或置入一定規模空間量體後，對現況的使用者行為、環境後續效應等之分析，新的空間計畫（programming）也因此必須一併地被檢討與修正；亦即，林區提醒專業者不應把業主委託或預擬之空間計畫內容視為既定條件，只技術性地操作處理與既有環境的關係，反而是應該將業主預擬的空間計畫放回基地環境中仔細檢討，並由其中修正或更細緻地定義原先預擬的空間計畫。而1970年代後「都市設計」強調「設計都市，而不是設計建築物」的新思考角度，則是進一步在形式的美學之外另外拉開了都市開放空間「公共性」面向的檢討，並意圖連結到都市的再發展策略，從公共福祉的角度執行都市空間的改造。\n\n請就上述之思考角度，針對目前許多中型都市陸續將啟動的鐵路高架計畫中，最為關鍵的高架火車站與站前廣場改善計畫，假設擬參加縣市政府舉辦兩階段公開競圖「空間構想提案」的設計團隊，請就你曾經使用過的火車前後站環境的一般性特質做為基地條件，以圖示輔助文字說明的方式，說明如何分析火車站高架化處理後，對站前站後將帶來的新可能性與限制，並申論配合站體高架後之新空間構想所應考量的各個面向。",
 "107-1": "（一）說明你對都市或城鄉廣場的定義及種類？描繪一處臺灣都市或城鄉的廣場，說明其廣場空間形成的原因及變遷、廣場與周遭涵構的互動、不同時間活動與空間關係、空間型態與視野。",
 "107-2": "（二）繪製這個廣場的配置示意圖、剖面示意圖，表達空間構成、空間型態與尺度，並說明廣場成功的因素及未來的期待。\n\n【前題所指定的廣場，補充供理解】\n（一）說明你對都市或城鄉廣場的定義及種類？描繪一處臺灣都市或城鄉的廣場，說明其廣場空間形成的原因及變遷、廣場與周遭涵構的互動、不同時間活動與空間關係、空間型態與視野。",
 "106-1": "（一）請說明都市中「微氣候」形成之主要原因？在敷地與都市的規劃設計上，若忽視微氣候資料的蒐集與分析，對實質環境可能造成那些負面的影響？請就都市設計的層面，闡述降低負面影響的各項對策。",
 "106-2": "（二）一個具有歷史文化價值的都市需要被妥善的關注與保護，請說明如何透過都市設計的手法，來保存珍貴且具有文化內涵之空間形式及舊有都市記憶。"
};
const EXAM_ORIGINALS={
114:`隨著都市規劃和建築設計的發展，敷地計畫的向度逐漸從地面延伸到立體而多層次的規劃策略。諸多理論中構成人們對於都市空間的感知與認知，有 Kevin Lynch 解析之路徑、邊界、節點、地標、區域元素類型，這些元素不再僅止於地面層的體會；若將其立體化的設計手法應用在現代都市中，可以增強都市空間的整體體驗和功能性。

而現代都市面對極端氣候的挑戰，需要以韌性城市政策誘導在設計上及使用上共同提升居住環境的抗壓能力和適應能力。都市空間不僅需要以量化的公共設施對應人口集居生活的需要，更得進一步兼顧公共服務功能、生活體驗及防災能力。請試述面對極端氣候，韌性城市目標下的敷地計畫，在防洪、綠化、水資源、替代能源、避難通道、空間彈性方面，有那些立體化作為？`,
113:`隨著全球極端氣候的惡化，對都市城鄉地區也產生了諸多規模更為嚴峻的災害；極端氣候的受災範圍更為擴大，水患也最為居民所苦。其中降雨集中、排水不及、致生社區水災，對居民造成直接的生命財產損失。請問在建築開發進行敷地計畫時，應作那些基地環境的「水文調查」？並試問在都市排水系統未能規劃擴充，或系統改建耗費時日狀況之下，在都市設計及敷地計畫層面，分別有那些可行的方案，有助於減緩城鄉水患的風險？`
};

function examSourceBlock(x){const sub=EXAM_SUBNUM[x.id]||'',official=pdfLink(x.year),expanded=!!showSources[x.id];return `<section class="source-per-question"><div class="source-toggle-head"><div class="source-title">📚 申論題來源與出處</div><button class="btn no-print" data-source="${x.id}" aria-expanded="${expanded}">${expanded?'隱藏出處':'顯示來源'}</button></div><div class="${expanded?'':'hidden'}" data-source-body="${x.id}"><div class="source-meta"><b>出題機關：</b>考選部　　<b>考試：</b>民國 ${x.year} 年專門職業及技術人員高等考試（建築師）</div><div class="source-meta"><b>科目：</b>敷地計畫與都市設計　　<b>試卷代號：</b>80150　　<b>題號：</b>申論題第一題${sub}</div><div class="source-meta">原始題目以考選部試卷為準；本 App 之答題內容為自行編寫的考前複習參考，非官方標準答案。</div><a href="${official}" target="_blank" rel="noopener noreferrer" class="source-official">查看考選部 ${x.year} 年官方試題 PDF ↗</a><div class="source-meta offline-note">官方連結需要網路；題庫原文與答題可離線閱讀。</div></div></section>`}
function renderQuestion(x,index){const section=x.sections.map((s,i)=>`<div class="subhead">（${['一','二','三','四','五','六','七','八'][i]}）${esc(s.title)}</div><ol>${s.items.map(v=>`<li>${esc(v)}</li>`).join('')}</ol>`).join('');const reveal=showAnswers[x.id]!==false;return `<article class="subquestion" id="q-${x.id}"><div class="topline"><div><span class="chip">第 ${index+1} 子題</span> <span class="chip">${esc(x.topic)}</span><h3 class="question-title">${esc(x.title)}</h3></div></div>${examFullBlock(x)}${examSourceBlock(x)}<div class="block"><h3>歷屆題目（題意摘要）</h3><div class="question">${esc(x.question)}</div><div class="pill">題意摘要非原題全文；答題為備考範例</div></div><section class="block answer-section"><div class="answer-head"><h3>申論題參考答案</h3><button class="btn no-print" data-answer="${x.id}" aria-expanded="${reveal}">${reveal?'隱藏答案（自測）':'顯示答案'}</button></div><div class="${reveal?'':'hidden'}" data-answer-body="${x.id}"><section class="block"><h3>一、前言</h3><p>${esc(x.intro)}</p></section><section class="block"><h3>二、分項論述</h3>${section}</section><section class="block"><h3>三、結論</h3><p>${esc(x.conclusion)}</p></section><section class="block"><h3>考前速記</h3><div class="memo"><b>${esc(x.keywords)}</b></div></section><section class="block"><h3>延伸知識點／得分提醒</h3><p>${esc(x.notes)}</p></section></div></section><section class="note-editor"><h3>個人補充筆記</h3><div class="hint" style="margin-top:0">可自由編輯重點、法條、手繪圖說提示。於本裝置瀏覽器自動儲存，每個子題獨立保留；更換裝置請使用匯出／匯入筆記。</div><label for="note-${x.id}">第 ${index+1} 子題筆記</label><textarea id="note-${x.id}" data-note="${x.id}" placeholder="在此輸入個人補充、考前速記或圖面提示……">${esc(noteStore[x.id]||'')}</textarea><div class="note-status" data-save="${x.id}">尚未編輯</div></section><div class="backtop-wrap no-print"><button type="button" class="backtop-btn" data-backtop="${x.id}">↑ 回頂端</button></div></article>`}
function renderDetail(){const group=DATA.filter(x=>x.year===selectedYear);if(!group.length){$('detail').innerHTML='<p>請選擇年度題組</p>';return} $('detail').innerHTML=`<div class="year-heading"><div><span class="chip">${selectedYear} 年</span><h2>${selectedYear} 年度｜申論題合併題組</h2><div class="year-count">共 ${group.length} 個子題，同年度集中閱讀，各題答案及筆記獨立</div></div><div class="actions no-print"><button id="openAll">展開全部原題</button><button id="closeAll">收合全部原題</button><button id="printYear" class="primary">列印本年度 / PDF</button></div></div><div class="mini-topics">${esc(group.map((x,i)=>`第 ${i+1} 題：${x.title}`).join('　｜　'))}</div>${group.map((x,i)=>renderQuestion(x,i)).join('')}<div class="source"><b>核對來源</b>｜<a href="${sources.essays}" target="_blank" rel="noopener">歷屆申論題索引</a> ・ <a href="${sources.index}" target="_blank" rel="noopener">考選部歷年試卷</a><p class="muted">本 App 收錄 106–114 年 14 個獨立申論子題；105 年為設計題組。答案為學習範例，非官方標準答案。法規題請另核對現行條文。</p></div>`;
 $('detail').querySelectorAll('[data-original]').forEach(btn=>btn.onclick=()=>{const id=btn.dataset.original;showOriginals[id]=!(showOriginals[id]!==false);const body=$('detail').querySelector(`[data-original-body="${id}"]`);body.classList.toggle('hidden',showOriginals[id]===false);btn.textContent=(showOriginals[id]!==false)?'隱藏原題':'顯示原題全文';btn.setAttribute('aria-expanded',String(showOriginals[id]!==false))});

$('search').oninput=render;$('year').onchange=render;$('topic').onchange=render;$('reset').onclick=()=>{$('search').value='';$('year').value='all';$('topic').value='all';render()};
$('exportNotes').onclick=()=>{const payload={format:'site-planning-notes-v1',exportedAt:new Date().toISOString(),notes:noteStore};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='敷地計畫_個人筆記備份.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('importNotes').onclick=()=>$('notesFile').click();$('notesFile').onchange=async e=>{const file=e.target.files?.[0];if(!file)return;try{const input=JSON.parse(await file.text());if(input.format!=='site-planning-notes-v1'||!input.notes||typeof input.notes!=='object'||Array.isArray(input.notes))throw Error('格式不符');const allowed=new Set(DATA.map(x=>x.id));for(const [id,value] of Object.entries(input.notes)){if(allowed.has(id)&&typeof value==='string')noteStore[id]=value};localStorage.setItem(NOTE_KEY,JSON.stringify(noteStore));renderDetail();alert('已匯入筆記（與現有筆記合併，同題以匯入內容為準）')}catch(err){alert('匯入失敗：請選擇此 App 匯出的 JSON 筆記檔')}e.target.value=''};
render();
</script><script>
if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost')){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(e=>console.warn('離線快取無法啟用',e)))}
</script></body></html>
